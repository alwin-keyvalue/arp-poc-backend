<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webhook LLM Trace</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f4f4f5; color: #18181b; }
    h1 { margin: 0 0 4px; font-size: 1.25rem; }
    .sub { color: #71717a; font-size: 0.85rem; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; max-width: 1400px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 0.95rem; }
    .event { padding: 10px; border: 1px solid #e4e4e7; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
    .event:hover { background: #fafafa; }
    .event.active { border-color: #2563eb; background: #eff6ff; }
    .event .time { font-size: 0.7rem; color: #71717a; }
    .event .subj { font-weight: 600; font-size: 0.85rem; margin: 4px 0; }
    .event .meta { font-size: 0.75rem; color: #52525b; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; background: #e4e4e7; font-size: 0.7rem; margin-right: 4px; }
    .call { border: 1px solid #e4e4e7; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .call-hdr { background: #f4f4f5; padding: 8px 12px; font-weight: 600; font-size: 0.85rem; }
    .call-body { padding: 10px 12px; }
    .call-body h3 { margin: 10px 0 4px; font-size: 0.75rem; color: #71717a; text-transform: uppercase; }
    .call-body h3:first-child { margin-top: 0; }
    pre { background: #18181b; color: #e4e4e7; padding: 10px; border-radius: 6px; overflow: auto; font-size: 0.75rem; line-height: 1.4; margin: 0; white-space: pre-wrap; word-break: break-word; }
    .skipped { color: #a1a1aa; font-style: italic; font-size: 0.85rem; }
    .empty { color: #71717a; font-size: 0.85rem; }
    .status { font-size: 0.75rem; color: #71717a; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Webhook LLM Trace</h1>
  <p class="sub">Webhook LLM trace · Reload the page after a webhook arrives · Delete <code>app/dev/</code> before production</p>

  <div class="grid">
    <div class="panel">
      <h2>Webhook events</h2>
      <div id="events"><p class="empty">Waiting for webhooks…</p></div>
      <p class="status" id="status">Reload this page to refresh events</p>
    </div>

    <div class="panel" id="detail">
      <h2>LLM trace</h2>
      <p class="empty">Select a webhook event to see LLM inputs and outputs.</p>
    </div>
  </div>

  <script>
    let selectedId = null;

    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function fmtTime(iso) {
      return new Date(iso).toLocaleString();
    }

    function renderCall(call) {
      const title = call.stage === "1_intent" ? "Call 1 — Intent classification" : "Call 2 — Field extraction";
      if (call.skipped) {
        return `<div class="call"><div class="call-hdr">${title}</div><div class="call-body"><p class="skipped">Skipped (FYI only)</p></div></div>`;
      }
      return `<div class="call">
        <div class="call-hdr">${title}</div>
        <div class="call-body">
          <h3>System prompt (input)</h3>
          <pre>${esc(call.system)}</pre>
          <h3>User prompt (input)</h3>
          <pre>${esc(call.user)}</pre>
          <h3>LLM output</h3>
          <pre>${esc(JSON.stringify(call.output, null, 2))}</pre>
        </div>
      </div>`;
    }

    async function loadEvents() {
      const res = await fetch("/dev/llm/events");
      const events = await res.json();
      const container = document.getElementById("events");

      if (!events.length) {
        container.innerHTML = '<p class="empty">No webhooks yet. Send an email to a subscribed inbox.</p>';
        return;
      }

      container.innerHTML = events.map((e) => `
        <div class="event ${e.id === selectedId ? "active" : ""}" data-id="${e.id}">
          <div class="time">${fmtTime(e.received_at)}</div>
          <div class="subj">${esc(e.subject || "(no subject)")}</div>
          <div class="meta">${esc(e.user_email)}</div>
          <div class="meta">
            <span class="badge">${esc(e.intent)}</span>
            <span class="badge">${esc(e.action)}</span>
            <span class="badge">${(e.confidence * 100).toFixed(0)}%</span>
          </div>
        </div>
      `).join("");

      container.querySelectorAll(".event").forEach((el) => {
        el.addEventListener("click", () => loadDetail(el.dataset.id));
      });

      if (selectedId && !events.find((e) => e.id === selectedId) && events[0]) {
        loadDetail(events[0].id);
      }
    }

    async function loadDetail(id) {
      selectedId = id;
      const res = await fetch(`/dev/llm/events/${id}`);
      if (!res.ok) return;
      const data = await res.json();

      document.getElementById("detail").innerHTML = `
        <h2>LLM trace</h2>
        <p class="meta" style="margin-bottom:12px">
          ${esc(data.user_email)} · ${fmtTime(data.received_at)}<br>
          ${esc(data.subject || "(no subject)")}
        </p>
        ${data.calls.map(renderCall).join("")}
        <div class="call" style="border-color:#2563eb">
          <div class="call-hdr" style="background:#eff6ff;color:#1d4ed8">Final result</div>
          <div class="call-body"><pre>${esc(JSON.stringify(data.result, null, 2))}</pre></div>
        </div>
      `;

      loadEvents();
    }

    loadEvents();
  </script>
</body>
</html>
